---
# This repository is a Zephyr module, so nothing here builds on its own: the
# workspace, the application and the tests all live in k-fsw. The job takes
# k-fsw's development manifest, lets west fetch every sibling at its pinned
# revision, and then replaces this module with the commit under test. What it
# proves is narrow and worth having: that this change still formats, still
# analyses clean, still builds the reference composition, and still passes the
# suites, without waiting for somebody to move the pin in k-fsw.
name: Module CI

"on":
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  KFSW_MODULE_PATH: kfsw-services

jobs:
  module:
    name: MODULE / build, quality and tests
    runs-on: ubuntu-24.04

    steps:
      - name: Check out K-FSW
        uses: actions/checkout@v7
        with:
          repository: dgonzalez97/k-fsw
          ref: develop
          path: k-fsw

      - name: Set up the workspace
        uses: ./k-fsw/.github/actions/workspace
        with:
          packages: cppcheck clang-format

      # After the workspace exists, so this overwrites the pinned revision west
      # just fetched. The pin is what k-fsw releases; this is what is proposed.
      - name: Put this commit in place of the pinned revision
        uses: actions/checkout@v7
        with:
          path: ${{ env.KFSW_MODULE_PATH }}

      # libcsp and libparam are west projects that live inside kfsw-comms and
      # kfsw-services, so replacing a module wipes the clone west put there.
      - name: Put the nested projects back
        run: west update libcsp libparam

      - name: Say which revisions are being tested
        run: |
          echo "k-fsw:    $(git -C k-fsw rev-parse --short HEAD) (develop)"
          echo "$KFSW_MODULE_PATH: $(git -C "$KFSW_MODULE_PATH" rev-parse --short HEAD)"

      # This job tests the module against k-fsw develop as it stands now, and
      # not waiting for the pin to move is the point of it. But a k-fsw develop
      # much older than the commit under test is the shape of a failure that has
      # nothing to do with the module, so say so before the suites run rather
      # than leaving it to be found in a build log.
      - name: Say how old the k-fsw checkout is
        run: |
          kfsw_at="$(git -C k-fsw log -1 --format=%ct)"
          module_at="$(git -C "$KFSW_MODULE_PATH" log -1 --format=%ct)"
          behind=$(( (module_at - kfsw_at) / 3600 ))
          echo "k-fsw develop is ${behind}h older than this commit"
          if [ "$behind" -gt 24 ]; then
            echo "::warning::k-fsw develop is ${behind}h older than the commit under test. If a suite fails on a symbol or header that does not exist, push the k-fsw [DEPS] pin and its companion changes first, then re-run this job."
          fi

      - name: Validate west manifest
        run: west manifest --validate

      - name: Build the reference composition
        run: ./k-fsw/tools/ci/build.sh linux

      - name: Quality
        run: ./k-fsw/tools/ci/quality.sh

      - name: Unit tests
        run: ./k-fsw/tools/ci/unit.sh

      # The reports and the per-test logs only. The whole tree is some 900k
      # files of build output, enough to run the upload action out of heap.
      - name: Keep the test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: twister-output
          path: |
            build/twister/twister.log
            build/twister/twister.json
            build/twister/testplan.json
            build/twister/**/build.log
            build/twister/**/handler.log
          if-no-files-found: ignore
          retention-days: 7
